name: Build IPA

# builds an unsigned .ipa on a github-hosted mac.
# download it from the run's artifacts and sign it with a sideloading tool.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (macos-26-intel or macos-26)"
        default: macos-26-intel

permissions:
  contents: write

jobs:
  build:
    # intel by default, the arm64 macos pool is often out of capacity
    runs-on: ${{ inputs.runner || 'macos-26-intel' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # runs the real weebcentral client against the live site. informational only,
      # the site may refuse the build machine and that must not block the build.
      - name: Source smoke test (live site)
        continue-on-error: true
        run: |
          swiftc -parse-as-library -O \
            Yomikaze/Models/SourceModels.swift \
            Yomikaze/Services/HTMLScraping.swift \
            Yomikaze/Services/WeebCentral.swift \
            Yomikaze/Services/Artwork.swift \
            Yomikaze/Services/BackupFormat.swift \
            Tools/SmokeTest/SmokeTest.swift \
            -o smoke-test
          ./smoke-test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Yomikaze.xcodeproj \
            -scheme Yomikaze \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Yomikaze.app Payload/
          zip -qry Yomikaze.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Yomikaze-ipa
          path: Yomikaze.ipa

      # keeps one "latest" release with the newest build as a stable download page
      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          sleep 3
          gh release create latest Yomikaze.ipa \
            --target "$GITHUB_SHA" \
            --title "Yomikaze latest build" \
            --notes "Unsigned build of the newest commit. Sign and install Yomikaze.ipa with a sideloading tool such as Sideloadly or AltStore."

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
