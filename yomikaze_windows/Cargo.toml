[package]
name = "yomikaze"
version = "0.2.7"
edition = "2024"
description = "Yomikaze - manga reader for Windows"

[dependencies]
eframe = "0.36"
egui = "0.36"
egui-phosphor = { version = "0.14", features = ["regular"] }
poll-promise = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

ab_glyph = "0.2"
ureq = { version = "3", features = ["json"] }
arboard = "3"
dirs = "7"
chrono = "0.4"
rfd = "0.18"
open = "5"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_WinRT", "Win32_System_Power", "Win32_UI_Shell", "Security_Credentials_UI", "Foundation", "Win32_Graphics_Dwm", "Win32_Globalization", "Win32_Security_Cryptography", "Win32_System_Threading"] }
raw-window-handle = "0.6"
windows-future = "0.3"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
